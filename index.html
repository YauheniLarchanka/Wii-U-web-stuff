  }
  window.setGwMode = reset;

  customInputHandler = function(cmd) {
    if (cmd === 'LEFT' && catchPos > 0) { catchPos--; beep(400, 20); }
    else if (cmd === 'RIGHT' && catchPos < 2) { catchPos++; beep(400, 20); }
    else if (cmd === 'A' && misses >= 3) reset(mode);
  };

  reset(1);

  activeLoop = setInterval(function() {
    if (misses < 3) {
      tick++;
      if (fallenTimer > 0) fallenTimer--;
      var speed = (mode === 1) ? 4 : 3;
      if (tick % speed === 0) {
        for (var i = jumpers.length - 1; i >= 0; i--) {
          var j = jumpers[i];
          j.step++;
          if (j.step === 2 || j.step === 5 || j.step === 8) {
            var reqPos = (j.step === 2) ? 0 : (j.step === 5 ? 1 : 2);
            if (catchPos === reqPos) {
              score += 1;
              beep(680, 40);
            } else {
              misses++;
              fallenX = path[j.step].x;
              fallenTimer = 8;
              jumpers.splice(i, 1);
              beep(140, 200);
            }
          } else if (j.step >= 9) {
            score += 3;
            beep(920, 70);
            jumpers.splice(i, 1);
          } else {
            beep(320, 15);
          }
        }
        var maxJumpers = (mode === 1) ? 2 : 3;
        if (jumpers.length === 0 || (jumpers.length < maxJumpers && tick % (speed * 5) === 0)) {
          jumpers.push({ step: 0 });
        }
        updateGwHud(score, misses);
      }
    }

    ctx.fillStyle = '#9ead86';
    ctx.fillRect(0, 0, 510, 340);

    ctx.fillStyle = GW_INK;
    ctx.fillRect(8, 25, 62, 295);
    ctx.fillStyle = '#9ead86';
    for (var wy=45; wy<260; wy+=50) {
      ctx.fillRect(20, wy, 16, 26);
      ctx.fillRect(44, wy, 16, 26);
    }
    ctx.fillStyle = GW_INK;
    var fOff = (tick % 2) * 5;
    ctx.beginPath();
    ctx.moveTo(12, 25); ctx.lineTo(25, 4 + fOff); ctx.lineTo(38, 25);
    ctx.lineTo(52, 2 - fOff); ctx.lineTo(66, 25);
    ctx.fill();

    ctx.fillStyle = GW_INK;
    ctx.fillRect(420, 210, 82, 72);
    ctx.fillStyle = '#9ead86';
    ctx.fillRect(426, 220, 26, 22);
    ctx.fillRect(466, 226, 22, 8);
    ctx.fillRect(473, 219, 8, 22);
    ctx.fillStyle = GW_INK;
    ctx.beginPath(); ctx.arc(440, 286, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(482, 286, 12, 0, Math.PI*2); ctx.fill();

    for (var s=0; s<path.length; s++) {
      ctx.fillStyle = GW_GHOST;
      ctx.beginPath(); ctx.arc(path[s].x, path[s].y - 8, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(path[s].x - 8, path[s].y, 16, 12);
    }

    ctx.fillStyle = GW_INK;
    for (var k=0; k<jumpers.length; k++) {
      var p = path[jumpers[k].step];
      ctx.beginPath(); ctx.arc(p.x, p.y - 8, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(p.x - 9, p.y, 18, 12);
      ctx.fillRect(p.x - 15, p.y - 2, 30, 4);
      ctx.fillRect(p.x - 8, p.y + 12, 5, 8);
      ctx.fillRect(p.x + 3, p.y + 12, 5, 8);
    }

    var bounceX = [145, 255, 365];
    for (var c=0; c<3; c++) {
      var bx = bounceX[c];
      ctx.fillStyle = (catchPos === c) ? GW_INK : GW_GHOST;
      ctx.beginPath(); ctx.arc(bx - 30, 266, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(bx - 36, 276, 12, 32);
      ctx.beginPath(); ctx.arc(bx + 30, 266, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(bx + 24, 276, 12, 32);
      ctx.fillRect(bx - 26, 282, 52, 8);
    }

    if (fallenTimer > 0) {
      ctx.fillStyle = GW_INK;
      ctx.fillRect(fallenX - 18, 312, 36, 10);
      ctx.beginPath(); ctx.arc(fallenX - 16, 314, 7, 0, Math.PI*2); ctx.fill();
    }

    if (misses >= 3) drawGwGameOver(ctx);
  }, 105);
}

/* G&W 3: HELMET */
function runGwHelmet(ctx) {
  var runnerX = [110, 182, 255, 328, 400];
  var runnerPos = 0, score = 0, misses = 0, mode = 1, tick = 0;
  var tools = [], rightDoorOpen = true, hitTimer = 0;

  function reset(m) {
    mode = m || mode;
    document.getElementById('gw-btn-a').className = (mode===1)?'flat-btn active':'flat-btn';
    document.getElementById('gw-btn-b').className = (mode===2)?'flat-btn active':'flat-btn';
    score = 0; misses = 0; runnerPos = 0; tick = 0; hitTimer = 0;
    tools = [
      { col: 1, row: 0, type: 0 },
      { col: 3, row: 2, type: 2 }
    ];
    updateGwHud(score, misses, 'DOOR: OPEN');
  }
  window.setGwMode = reset;

  customInputHandler = function(cmd) {
    if (cmd === 'LEFT' && runnerPos > 0) { runnerPos--; beep(450, 20); }
    else if (cmd === 'RIGHT') {
      if (runnerPos < 4) {
        runnerPos++;
        beep(450, 20);
      } else if (runnerPos === 4 && rightDoorOpen) {
        score += 5;
        runnerPos = 0;
        beep(880, 90);
        updateGwHud(score, misses, rightDoorOpen ? 'DOOR: OPEN' : 'DOOR: CLOSED');
      }
    } else if (cmd === 'A' && misses >= 3) reset(mode);
  };

  reset(1);

  activeLoop = setInterval(function() {
    if (misses < 3) {
      tick++;
      if (hitTimer > 0) hitTimer--;
      var speed = (mode === 1) ? 4 : 3;
      if (tick % speed === 0) {
        if (tick % 16 === 0) rightDoorOpen = true;
        else if (tick % 28 === 0) rightDoorOpen = false;

        for (var i = tools.length - 1; i >= 0; i--) {
          var t = tools[i];
          t.row++;
          if (t.row === 4) {
            if (runnerPos === t.col) {
              misses++;
              hitTimer = 8;
              runnerPos = 0;
              beep(130, 220);
            }
          } else if (t.row > 4) {
            tools.splice(i, 1);
          }
        }
        var maxTools = (mode === 1) ? 3 : 5;
        if (tools.length < maxTools) {
          tools.push({
            col: Math.floor(Math.random() * 5),
            row: 0,
            type: Math.floor(Math.random() * 3)
          });
        }
        beep(260, 10);
        updateGwHud(score, misses, rightDoorOpen ? 'DOOR: OPEN' : 'DOOR: CLOSED');
      }
    }

    ctx.fillStyle = '#9ead86';
    ctx.fillRect(0, 0, 510, 340);

    ctx.fillStyle = GW_INK;
    ctx.fillRect(8, 175, 58, 145);
    ctx.fillStyle = '#9ead86';
    ctx.fillRect(22, 225, 36, 95);

    ctx.fillStyle = GW_INK;
    ctx.fillRect(444, 175, 58, 145);
    if (rightDoorOpen) {
      ctx.fillStyle = '#9ead86';
      ctx.fillRect(450, 225, 36, 95);
    } else {
      ctx.strokeStyle = '#9ead86';
      ctx.lineWidth = 2;
      ctx.strokeRect(450, 225, 36, 95);
    }
    ctx.fillStyle = GW_INK;
    ctx.fillRect(0, 316, 510, 10);

    for (var c=0; c<5; c++) {
      for (var r=0; r<5; r++) {
        var tx = runnerX[c];
        var ty = 42 + r * 48;
        var activeTool = null;
        for (var k=0; k<tools.length; k++) {
          if (tools[k].col === c && tools[k].row === r) activeTool = tools[k];
        }
        ctx.fillStyle = activeTool ? GW_INK : GW_GHOST;
        var toolType = activeTool ? activeTool.type : ((c + r) % 3);
        if (toolType === 0) {
          ctx.fillRect(tx - 12, ty - 6, 24, 9);
          ctx.fillRect(tx - 3, ty + 3, 6, 18);
        } else if (toolType === 1) {
          ctx.fillRect(tx - 4, ty - 8, 8, 24);
          ctx.beginPath(); ctx.arc(tx, ty - 8, 8, 0, Math.PI*2); ctx.fill();
        } else {
          ctx.fillRect(tx - 11, ty - 4, 22, 20);
          ctx.fillRect(tx - 14, ty - 7, 28, 4);
        }
      }
    }

    for (var p=0; p<5; p++) {
      var rx = runnerX[p];
      ctx.fillStyle = (runnerPos === p) ? GW_INK : GW_GHOST;
      ctx.beginPath(); ctx.arc(rx, 260, 13, Math.PI, 0); ctx.fill();
      ctx.fillRect(rx - 17, 258, 34, 4);
      ctx.beginPath(); ctx.arc(rx, 268, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(rx - 8, 276, 16, 24);
      ctx.fillRect(rx - 12, 300, 8, 16);
      ctx.fillRect(rx + 4, 300, 8, 16);
    }

    if (misses >= 3) drawGwGameOver(ctx);
  }, 105);
}

/* G&W 4: CHEF */
function runGwChef(ctx) {
  var laneX = [145, 245, 345];
  var maxHeightPerLane = [4, 3, 2];
  var chefPos = 1, score = 0, misses = 0, mode = 1, tick = 0;
  var foods = [];

  function reset(m) {
    mode = m || mode;
    document.getElementById('gw-btn-a').className = (mode===1)?'flat-btn active':'flat-btn';
    document.getElementById('gw-btn-b').className = (mode===2)?'flat-btn active':'flat-btn';
    score = 0; misses = 0; chefPos = 1; tick = 0;
    foods = [
      { lane: 0, h: 3, dir: -1 },
      { lane: 1, h: 1, dir: 1 },
      { lane: 2, h: 2, dir: -1 }
    ];
    updateGwHud(score, misses);
  }
  window.setGwMode = reset;

  customInputHandler = function(cmd) {
    if (cmd === 'LEFT' && chefPos > 0) { chefPos--; beep(440, 20); }
    else if (cmd === 'RIGHT' && chefPos < 2) { chefPos++; beep(440, 20); }
    else if (cmd === 'A' && misses >= 3) reset(mode);
  };

  reset(1);

  activeLoop = setInterval(function() {
    if (misses < 3) {
      tick++;
      var speed = (mode === 1) ? 4 : 3;
      if (tick % speed === 0) {
        for (var i=0; i<foods.length; i++) {
          var f = foods[i];
          var nextH = f.h + f.dir;
          if (nextH > maxHeightPerLane[f.lane]) {
            f.dir = -1;
            f.h = maxHeightPerLane[f.lane] - 1;
          } else if (nextH < 0) {
            if (chefPos === f.lane) {
              f.dir = 1;
              f.h = 1;
              score += 1;
              beep(720, 40);
            } else {
              misses++;
              f.dir = 1;
              f.h = maxHeightPerLane[f.lane];
              beep(140, 200);
            }
          } else {
            f.h = nextH;
          }
        }
        updateGwHud(score, misses);
      }
    }

    ctx.fillStyle = '#9ead86';
    ctx.fillRect(0, 0, 510, 340);

    ctx.fillStyle = GW_INK;
    ctx.fillRect(10, 140, 70, 6);
    ctx.beginPath(); ctx.arc(42, 115, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(32, 98, 6, 10);
    ctx.fillRect(46, 98, 6, 10);
    ctx.fillRect(34, 124, 16, 16);

    for (var l=0; l<3; l++) {
      var lx = laneX[l];
      for (var h=0; h<=maxHeightPerLane[l]; h++) {
        var fy = 225 - h * 42;
        var isHere = false;
        for (var k=0; k<foods.length; k++) {
          if (foods[k].lane === l && foods[k].h === h) isHere = true;
        }
        ctx.fillStyle = isHere ? GW_INK : GW_GHOST;
        if (l === 0) {
          ctx.fillRect(lx - 18, fy - 6, 36, 12);
          ctx.beginPath(); ctx.arc(lx - 18, fy, 6, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(lx + 18, fy, 6, 0, Math.PI*2); ctx.fill();
        } else if (l === 1) {
          ctx.beginPath(); ctx.arc(lx, fy, 12, 0, Math.PI*2); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(lx + 10, fy); ctx.lineTo(lx + 22, fy - 9); ctx.lineTo(lx + 22, fy + 9);
          ctx.fill();
        } else {
          ctx.fillRect(lx - 22, fy - 5, 44, 10);
        }
      }
    }

    for (var c=0; c<3; c++) {
      var cx = laneX[c];
      ctx.fillStyle = (chefPos === c) ? GW_INK : GW_GHOST;
      ctx.fillRect(cx - 24, 248, 48, 7);
      ctx.fillRect(cx + 24, 249, 22, 5);
      var bodyX = cx + 62;
      ctx.fillRect(bodyX - 12, 206, 24, 22);
      ctx.beginPath(); ctx.arc(bodyX, 204, 14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(bodyX, 238, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(bodyX - 14, 250, 28, 48);
      ctx.fillRect(bodyX - 14, 298, 10, 20);
      ctx.fillRect(bodyX + 4, 298, 10, 20);
    }

    ctx.fillStyle = (misses > 0) ? GW_INK : GW_GHOST;
    ctx.beginPath(); ctx.arc(95, 316, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(75, 318, 16, 3);

    if (misses >= 3) drawGwGameOver(ctx);
  }, 105);
}

/* G&W 5: OCTOPUS */
function runGwOctopus(ctx) {
  var diverNodes = [
    {x: 68,  y: 78},
    {x: 92,  y: 148},
    {x: 145, y: 215},
    {x: 218, y: 268},
    {x: 300, y: 292},
    {x: 392, y: 292}
  ];
  var tentacleChains = [
    [ {x:235,y:135}, {x:185,y:140}, {x:138,y:144}, {x:92,y:148} ],
    [ {x:260,y:165}, {x:220,y:182}, {x:182,y:198}, {x:145,y:215} ],
    [ {x:295,y:185}, {x:270,y:212}, {x:244,y:240}, {x:218,y:268} ],
    [ {x:335,y:190}, {x:322,y:224}, {x:310,y:258}, {x:300,y:292} ]
  ];

  var diverPos = 0, hasGold = false, score = 0, misses = 0, mode = 1, tick = 0;
  var tentacles = [
    { len: 1, dir: 1 },
    { len: 2, dir: -1 },
    { len: 0, dir: 1 },
    { len: 3, dir: -1 }
  ];

  function reset(m) {
    mode = m || mode;
    document.getElementById('gw-btn-a').className = (mode===1)?'flat-btn active':'flat-btn';
    document.getElementById('gw-btn-b').className = (mode===2)?'flat-btn active':'flat-btn';
    score = 0; misses = 0; diverPos = 0; hasGold = false; tick = 0;
    tentacles = [
      { len: 1, dir: 1 },
      { len: 2, dir: -1 },
      { len: 0, dir: 1 },
      { len: 2, dir: 1 }
    ];
    updateGwHud(score, misses, 'NO GOLD');
  }
  window.setGwMode = reset;

  function checkTentacleCollision() {
    if (diverPos >= 1 && diverPos <= 4) {
      var tIdx = diverPos - 1;
      if (tentacles[tIdx].len === 3) {
        misses++;
        diverPos = 0;
        hasGold = false;
        beep(130, 240);
        updateGwHud(score, misses, 'CAUGHT!');
      }
    }
  }

  customInputHandler = function(cmd) {
    if (misses >= 3) {
      if (cmd === 'A') reset(mode);
      return;
    }
    if (cmd === 'RIGHT') {
      if (diverPos < 5) {
        diverPos++;
        beep(440, 25);
        checkTentacleCollision();
      } else if (diverPos === 5) {
        hasGold = true;
        score += 1;
        beep(780, 50);
      }
    } else if (cmd === 'LEFT') {
      if (diverPos > 0) {
        diverPos--;
        beep(440, 25);
        if (diverPos === 0 && hasGold) {
          score += 10;
          hasGold = false;
          beep(980, 110);
        } else {
          checkTentacleCollision();
        }
      }
    }
    updateGwHud(score, misses, hasGold ? 'CARRYING GOLD!' : 'DIVE FOR GOLD');
  };

  reset(1);

  activeLoop = setInterval(function() {
    if (misses < 3) {
      tick++;
      var speed = (mode === 1) ? 4 : 3;
      if (tick % speed === 0) {
        for (var i=0; i<4; i++) {
          var t = tentacles[i];
          if (Math.random() < 0.75) {
            t.len += t.dir;
            if (t.len >= 3) { t.len = 3; t.dir = -1; }
            if (t.len <= 0) { t.len = 0; t.dir = 1; }
          }
        }
        checkTentacleCollision();
      }
    }

    ctx.fillStyle = '#9ead86';
    ctx.fillRect(0, 0, 510, 340);

    ctx.strokeStyle = GW_INK;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 95); ctx.lineTo(510, 95); ctx.stroke();
    ctx.fillStyle = GW_INK;
    ctx.beginPath();
    ctx.moveTo(20, 68); ctx.lineTo(125, 68); ctx.lineTo(105, 95); ctx.lineTo(35, 95);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(52, 54, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(44, 62, 16, 8);

    ctx.fillStyle = GW_INK;
    ctx.beginPath(); ctx.arc(345, 135, 52, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9ead86';
    ctx.beginPath(); ctx.arc(325, 130, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(355, 130, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = GW_INK;
    ctx.beginPath(); ctx.arc(325, 130, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(355, 130, 4, 0, Math.PI*2); ctx.fill();

    for (var ti=0; ti<4; ti++) {
      var chain = tentacleChains[ti];
      for (var s=0; s<4; s++) {
        ctx.fillStyle = (s <= tentacles[ti].len) ? GW_INK : GW_GHOST;
        ctx.beginPath(); ctx.arc(chain[s].x, chain[s].y, 11 - s, 0, Math.PI*2); ctx.fill();
      }
    }

    ctx.fillStyle = GW_INK;
    ctx.fillRect(425, 265, 68, 48);
    ctx.fillStyle = '#9ead86';
    ctx.fillRect(432, 278, 54, 6);
    ctx.fillRect(454, 274, 10, 14);

    for (var d=0; d<diverNodes.length; d++) {
      var dn = diverNodes[d];
      var active = (diverPos === d);
      ctx.fillStyle = active ? GW_INK : GW_GHOST;
      ctx.beginPath(); ctx.arc(dn.x, dn.y - 12, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(dn.x - 9, dn.y - 2, 18, 22);
      ctx.fillRect(dn.x - 16, dn.y + 18, 12, 6);
      ctx.fillRect(dn.x + 4, dn.y + 18, 12, 6);
      if (active && hasGold) {
        ctx.beginPath(); ctx.arc(dn.x + 18, dn.y + 6, 9, 0, Math.PI*2); ctx.fill();
      }
    }

    if (misses >= 3) drawGwGameOver(ctx);
  }, 110);
}

/* --- C1. PAINT TOOL --- */
function initPaint(stage) {
  stage.innerHTML =
    '<div style="margin-bottom:6px;">' +
      '<button class="flat-btn" style="background:#000" onclick="setPaintCol(\'#000000\')">Black</button>' +
      '<button class="flat-btn" style="background:#e52521" onclick="setPaintCol(\'#e52521\')">Red</button>' +
      '<button class="flat-btn" style="background:#007aff" onclick="setPaintCol(\'#007aff\')">Blue</button>' +
      '<button class="flat-btn" style="background:#4cd964;color:#000" onclick="setPaintCol(\'#4cd964\')">Green</button>' +
      '<button class="flat-btn" style="background:#fbd000;color:#000" onclick="setPaintCol(\'#fbd000\')">Yellow</button>' +
      '<button class="flat-btn" onclick="setPaintSize(4)">Thin</button>' +
      '<button class="flat-btn" onclick="setPaintSize(12)">Thick</button>' +
      '<button class="flat-btn" onclick="clearPaint()">Clear</button>' +
    '</div>' +
    '<canvas id="paint-cv" width="760" height="368" style="background:#ffffff;border:2px solid #7b12f5;display:block;margin:0 auto;"></canvas>';

  var cv = document.getElementById('paint-cv');
  var ctx = cv.getContext('2d');
  var col = '#000000', sz = 5, drawing = false, lastX = 0, lastY = 0;

  window.setPaintCol = function(c) { col = c; beep(520, 20); };
  window.setPaintSize = function(s) { sz = s; beep(620, 20); };
  window.clearPaint = function() { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,760,368); beep(300, 50); };
  window.clearPaint();

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    var t = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); drawing = true; var p = getPos(e); lastX = p.x; lastY = p.y; }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = getPos(e);
    ctx.strokeStyle = col;
    ctx.lineWidth = sz;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end() { drawing = false; }

  cv.addEventListener('mousedown', start, false);
  cv.addEventListener('mousemove', move, false);
  window.addEventListener('mouseup', end, false);
  cv.addEventListener('touchstart', start, false);
  cv.addEventListener('touchmove', move, false);
  cv.addEventListener('touchend', end, false);
}

/* --- C2. CALCULATOR --- */
function initCalculator(stage) {
  var keys = [
    ['C', '√', '%', '/'],
    ['7', '8', '9', '*'],
    ['4', '5', '6', '-'],
    ['1', '2', '3', '+'],
    ['0', '.', '=', '=']
  ];
  var html = '<div style="width:360px;margin:0 auto;background:#120e24;padding:10px;border:2px solid #ffffff;">' +
    '<div id="calc-disp" style="height:52px;background:#9ead86;color:#111;font-size:28px;font-weight:bold;text-align:right;line-height:52px;padding:0 10px;margin-bottom:8px;overflow:hidden;">0</div>' +
    '<table style="width:100%;border-collapse:collapse;table-layout:fixed;">';
  for (var r=0; r<keys.length; r++) {
    html += '<tr>';
    for (var c=0; c<4; c++) {
      var k = keys[r][c];
      html += '<td onclick="pressCalc(\'' + k + '\')" style="height:56px;background:#633483;border:3px solid #120e24;text-align:center;font-size:22px;font-weight:bold;cursor:pointer;">' + k + '</td>';
    }
    html += '</tr>';
  }
  html += '</table></div>';
  stage.innerHTML = html;

  var expr = '';
  window.pressCalc = function(k) {
    beep(540, 25);
    var d = document.getElementById('calc-disp');
    if (k === 'C') { expr = ''; d.innerHTML = '0'; }
    else if (k === '√') {
      var v = parseFloat(expr || '0');
      expr = String(Math.sqrt(v));
      d.innerHTML = expr.slice(0, 12);
    } else if (k === '=') {
      try {
        expr = String(eval(expr || '0'));
        d.innerHTML = expr.slice(0, 12);
      } catch(e) { d.innerHTML = 'ERR'; expr = ''; }
    } else {
      expr += k;
      d.innerHTML = expr.slice(-12);
    }
  };
}

/* --- C3. TIMER & STOPWATCH --- */
function initTimer(stage) {
  stage.innerHTML =
    '<div id="timer-box" style="width:520px;margin:20px auto;background:#120e24;border:3px solid #ffffff;padding:24px;text-align:center;">' +
      '<div id="timer-disp" style="font-size:64px;font-family:monospace;font-weight:bold;margin-bottom:18px;">00:00.0</div>' +
      '<div>' +
        '<button class="flat-btn active" onclick="startStopTimer()">Start / Pause (A)</button>' +
        '<button class="flat-btn" onclick="resetTimer()">Reset</button>' +
        '<button class="flat-btn" onclick="setCountdown(600)">+1 Min Countdown</button>' +
      '</div>' +
    '</div>';

  var tenths = 0, running = false, countdown = false;
  function fmt(t) {
    var totalSec = Math.floor(t / 10);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    var d = t % 10;
    return (m<10?'0'+m:m) + ':' + (s<10?'0'+s:s) + '.' + d;
  }
  window.startStopTimer = function() { running = !running; beep(600, 40); };
  window.resetTimer = function() { running = false; tenths = 0; countdown = false; document.getElementById('timer-disp').innerHTML = '00:00.0'; beep(350, 40); };
  window.setCountdown = function(add) { running = false; countdown = true; tenths += add; document.getElementById('timer-disp').innerHTML = fmt(tenths); beep(700, 40); };

  customInputHandler = function(cmd) {
    if (cmd === 'A') window.startStopTimer();
  };

  activeLoop = setInterval(function() {
    if (!running) return;
    if (countdown) {
      tenths--;
      if (tenths <= 0) {
        tenths = 0; running = false;
        beep(880, 350);
        document.getElementById('timer-box').style.backgroundColor = '#850800';
      }
    } else {
      tenths++;
    }
    var el = document.getElementById('timer-disp');
    if (el) el.innerHTML = fmt(tenths);
  }, 100);
}

/* Boot Hub on Load */
window.onload = function() {
  drawMarioSprite();
  renderHubList();
};
